<!doctype html>
<html lang="ko">
<head><script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("app.theme")==="light"?"light":"dark")}catch(e){document.documentElement.setAttribute("data-theme","dark")}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>시설팀 사용량</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#777777; --line:#E4E4E4; --field-line:#BDBDBD; --soft:#F3F3F3;
  --accent:#111111; --accent-ink:#FFFFFF; --bad:#C62828; --bad-soft:#FDECEA; --ok:#1B7F3B;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#0E0E0E; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2A2A2A; --field-line:#4A4A4A; --soft:#1A1A1A;
  --accent:#F2F2F2; --accent-ink:#111111; --bad:#FF8A80; --bad-soft:#331816; --ok:#6FD38A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.on{background:var(--ok)}.dot.busy{background:#C99700}.dot.off{background:var(--bad)}

.appnav{padding-top:10px}
.navrow{display:flex;align-items:center;gap:2px}
.appnav a{padding:6px 9px;white-space:nowrap;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted);text-decoration:none;border:1px solid transparent}
.appnav a[aria-current="page"]{color:var(--ink);border-color:var(--line)}
.appnav a[href="duty.html"]{color:#D4A000}
.appnav a[href="schedule.html"]{color:#1B8A3A}
.appnav a[href="journal.html"]{color:var(--ink)}
.appnav a[href="docs.html"]{color:var(--muted)}
:root[data-theme="dark"] .appnav a[href="duty.html"]{color:#FFD54A}:root[data-theme="dark"] .appnav a[href="schedule.html"]{color:#6FD38A}
.sync{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.head{padding-block:18px 8px}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.yr{display:flex;align-items:center;gap:6px}
.yr button{width:34px;height:34px;border:1px solid var(--field-line);border-radius:8px;background:none;cursor:pointer;font-size:16px;line-height:1}
.yr button:disabled{opacity:.35;cursor:default}
.yr b{min-width:52px;text-align:center;font-size:16px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin:8px 0 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:13px;color:var(--muted);margin:8px 0 12px;line-height:1.5}
.banner{border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:10px;background:var(--bad-soft);color:var(--bad)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;margin-bottom:12px}
.card h2{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 small{font-weight:600;color:var(--muted);font-size:12px}
.sum{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{font-family:var(--f-ui);fill:var(--muted);font-size:10px}
.chart .cur{fill:var(--ink)}.chart .prv{fill:var(--field-line)}
.chart .part{opacity:.45}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{fill:var(--soft)}
.chart .grid{stroke:var(--line);stroke-width:1}
.det{font-size:13px;min-height:20px;margin-top:4px}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.gatebox{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.gatebox h2{margin:0;font-size:20px}
.gatebox p{margin:0;font-size:13px;color:var(--muted)}
.gatebox input{height:48px;border:1px solid var(--field-line);border-radius:8px;padding:0 14px;font-size:18px;background:var(--surface)}
.gatebox input:focus{outline:none;border-color:var(--ink)}
.btn{border:1px solid var(--ink);border-radius:8px;height:40px;padding:0 16px;font-weight:700;cursor:pointer;font-size:14px;background:var(--accent);color:var(--accent-ink)}
.err{color:var(--bad)}
:root{--bnav-h:calc(52px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{max-width:820px;margin:0 auto;display:flex}
.bnav a{flex:1;display:flex;align-items:center;justify-content:center;height:52px;font-size:14px;font-weight:700;text-decoration:none;color:var(--muted);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
.bnav a[href="journal.html"]{color:var(--ink)}
.bnav a[href="duty.html"]{color:#D4A000}
.bnav a[href="schedule.html"]{color:#1B8A3A}
.bnav a[aria-current="page"]{border-top-color:currentColor}
.bnav.hide{display:none}
@media print{.bnav{display:none!important}}
:root[data-theme="dark"] .bnav a[href="duty.html"]{color:#FFD54A}:root[data-theme="dark"] .bnav a[href="schedule.html"]{color:#6FD38A}
main{padding-bottom:calc(var(--bnav-h) + 60px)}
.themebtn{flex:none;width:34px;height:34px;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);cursor:pointer;padding:0}a + .themebtn{margin-left:auto}.sync + .themebtn{margin-left:6px}.navrow .sync{flex:1 1 0;min-width:0;justify-content:flex-end}.navrow .sync span:last-child{white-space:normal}.appnav a[href="mof.html"]{color:#2F6FC4}.bnav a[href="mof.html"]{color:#2F6FC4}:root[data-theme="dark"] .appnav a[href="mof.html"]{color:#7FB2FF}:root[data-theme="dark"] .bnav a[href="mof.html"]{color:#7FB2FF}
.chartbtn{flex:none;width:34px;height:34px;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;padding:0}.chartbtn[aria-current="page"]{background:var(--soft)}.appnav a.chartbtn{padding:0;border:1px solid var(--line)}.sync + .chartbtn{margin-left:6px}
.chartbtn{flex:none;width:34px;height:34px;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;padding:0}.chartbtn[aria-current="page"]{background:var(--soft)}.appnav a.chartbtn{padding:0;border:1px solid var(--line)}/*cb*/.sync + .chartbtn{margin-left:6px}.appnav .sync{min-width:0}@media(max-width:480px){.appnav .sync #syncText{display:none}.appnav .sync{flex:0 0 auto;margin-left:auto}.chartbtn{margin-left:4px}}
/*mof-nav-fit*/@media(max-width:430px){.appnav a{padding:6px 5px;font-size:13.5px}.navrow{gap:0}}@media(max-width:340px){.appnav a{padding:6px 4px;font-size:13px}}
/*cb2*/@media(max-width:400px){.appnav a{padding:6px 3px;font-size:13px}.chartbtn,.themebtn{width:30px;height:30px;margin-left:2px}.chartbtn svg{width:16px;height:16px}}@media(max-width:350px){.appnav a{padding:6px 2px;font-size:12.5px}.appnav{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<nav class="appnav gut"><div class="wrap navrow">
  <a href="journal.html">업무일지</a><a href="mof.html">MOF</a>
  <a href="duty.html">당직일지</a>
  <a href="schedule.html">근무표</a>
  <a href="docs.html">문서</a>
  <span class="sync"><span class="dot" id="syncDot"></span><span id="syncText">연결 중…</span></span>
<a class="chartbtn" href="usage.html" aria-label="사용량 그래프" title="사용량 그래프" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></a><button type="button" class="themebtn" id="themeBtn"></button></div></nav>
<nav class="bnav" aria-label="메뉴"><div class="in"><a href="journal.html">업무일지</a><a href="mof.html">MOF</a><a href="duty.html">당직일지</a><a href="schedule.html">근무표</a><a href="docs.html">문서</a></div></nav>


<header class="head gut"><div class="wrap">
  <div class="titlebar"><h1>사용량</h1>
    <div class="yr"><button type="button" id="yPrev" aria-label="이전 해">‹</button><b id="yLbl"></b><button type="button" id="yNext" aria-label="다음 해">›</button></div></div>
  <div class="legend"><span><i style="background:var(--ink)"></i><span id="lgCur"></span></span><span><i style="background:var(--field-line)"></i><span id="lgPrv"></span></span><span><i style="background:var(--ink);opacity:.45"></i>기록이 일부 빠진 달</span></div>
  <div class="note" id="note"></div>
</div></header>
<main class="gut"><div class="wrap">
  <div id="msgs"></div>
  <div id="cards"></div>
</div></main>
<div class="gate" id="gate" hidden>
  <form class="gatebox" id="gateForm">
    <h2>시설팀 사용량</h2>
    <p>팀 코드를 입력하세요. 이 기기에 기억되어 다음부터는 묻지 않습니다.</p>
    <input id="gateInput" type="password" autocomplete="off" aria-label="팀 코드" required>
    <button type="submit" class="btn primary">확인</button>
    <p class="err" id="gateMsg"></p>
  </form>
</div>


<script>
(() => {
const CFG = window.DUTY_CONFIG || {};
const $ = id => document.getElementById(id);
const ITEMS = [
  {k:'elec',  label:'전력',       unit:'kWh', mode:'usage'},
  {k:'heat',  label:'난방/급탕',  unit:'',    mode:'cum'},
  {k:'cool',  label:'냉방',       unit:'',    mode:'cum'},
  {k:'water', label:'수도',       unit:'',    mode:'cum'},
  {k:'gas',   label:'도시가스',   unit:'',    mode:'cum'},
  {k:'drain', label:'주차장 영구배수', unit:'', mode:'cum'},
];
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function configured(){ return !!(CFG.supabaseUrl && CFG.supabaseKey && !/YOUR_|여기에/.test(CFG.supabaseUrl + CFG.supabaseKey)); }
function teamCode(){ return store.get('dutylog.team') || ''; }
function setSync(kind, text){ $('syncDot').className = 'dot ' + kind; $('syncText').textContent = text; }
const num = v => { if(v == null || v === '') return null; const n = Number(String(v).replace(/,/g, '')); return Number.isFinite(n) ? n : null; };
const r6 = x => Math.round(x * 1e6) / 1e6;
function fmt(n){ if(n == null) return '–'; const a = Math.abs(n); return n.toLocaleString('ko-KR', {maximumFractionDigits: a >= 1000 ? 0 : a >= 100 ? 1 : 2}); }
function dim(y, m){ return new Date(y, m, 0).getDate(); }

async function sb(path, opt){
  opt = opt || {};
  const headers = Object.assign({apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey, 'x-team-code': teamCode()}, opt.headers || {});
  const r = await fetch(CFG.supabaseUrl.replace(/\/+$/,'') + '/rest/v1/' + path, Object.assign({}, opt, {headers, cache:'no-store'}));
  if(!r.ok){ const e = new Error(await r.text().catch(() => String(r.status))); e.status = r.status; throw e; }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}

/* ---------- 계산: 당직일지와 같은 규칙 ----------
   누적계량: 사용량 = 금일 검침 - 직전 기록일 검침 (그 날짜에 귀속)
   전력: 기록된 값 자체가 그날 사용량 (MOF 유효 사용량)
   첫 기록의 직전 검침은 당직일지 '기준값'(config base) */
let logs = [], base = {}, loaded = false, year = new Date().getFullYear(), agg = {}, firstDate = '', lastDate = '', nRows = 0;
function compute(){
  agg = {}; const rows = logs.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  nRows = rows.length; firstDate = rows.length ? rows[0].date : ''; lastDate = rows.length ? rows[rows.length - 1].date : '';
  ITEMS.forEach(it => {
    const per = {}; let prev = num(((base.meters || {})[it.k] || {}).reading);
    rows.forEach(r => {
      const today = num((r.m || {})[it.k]); if(today == null) return;
      let u = null;
      if(it.mode === 'usage') u = today; else if(prev != null) u = r6(today - prev);
      if(it.mode !== 'usage') prev = today;
      if(u == null) return;
      const ym = r.date.slice(0, 7), o = per[ym] || (per[ym] = {sum: 0, days: 0});
      o.sum = r6(o.sum + u); o.days++;
    });
    agg[it.k] = per;
  });
}

/* ---------- 그리기 ---------- */
let sel = {};   // 항목별 선택한 월
const W = 340, H = 150, PL = 4, PR = 4, PT = 10, PB = 20;
function chartSVG(it){
  const y = year, per = agg[it.k] || {};
  const cur = [], prv = [];
  for(let m = 1; m <= 12; m++){
    const a = per[y + '-' + String(m).padStart(2, '0')], b = per[(y - 1) + '-' + String(m).padStart(2, '0')];
    cur.push(a ? {v: a.sum, days: a.days, full: a.days >= dim(y, m)} : null);
    prv.push(b ? {v: b.sum, days: b.days, full: b.days >= dim(y - 1, m)} : null);
  }
  const vals = cur.concat(prv).filter(Boolean).map(o => o.v);
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals), span = (max - min) || 1;
  const ih = H - PT - PB, y0 = PT + ih * (max / span), sc = v => ih * v / span;
  const cw = (W - PL - PR) / 12, bw = Math.min(11, cw * .38);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${it.label} ${y}년 월별 사용량">`;
  s += `<line class="grid" x1="${PL}" x2="${W - PR}" y1="${y0}" y2="${y0}"/>`;
  for(let m = 0; m < 12; m++){
    const cx = PL + cw * m + cw / 2;
    if(sel[it.k] === m) s += `<rect class="sel" x="${PL + cw * m}" y="${PT - 6}" width="${cw}" height="${ih + 6 + PB - 2}" rx="3"/>`;
    [[prv[m], -1, 'prv'], [cur[m], 1, 'cur']].forEach(([o, side, cls]) => {
      if(!o) return; const h = Math.max(1.5, Math.abs(sc(o.v))), top = o.v >= 0 ? y0 - h : y0;
      s += `<rect class="${cls}${o.full ? '' : ' part'}" x="${(cx + (side < 0 ? -bw - .5 : .5)).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5"/>`;
    });
    s += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${m + 1}</text>`;
    s += `<rect class="hit" data-k="${it.k}" data-m="${m}" x="${PL + cw * m}" y="0" width="${cw}" height="${H}"/>`;
  }
  return s + '</svg>';
}
function detail(it){
  const m = sel[it.k]; if(m == null) return '탭하면 그 달의 값을 봅니다.';
  const key = y => y + '-' + String(m + 1).padStart(2, '0'), per = agg[it.k] || {};
  const a = per[key(year)], b = per[key(year - 1)], u = it.unit ? ' ' + it.unit : '';
  const part = o => o && o.days < dim(+key(year).slice(0, 4), m + 1) ? ` (${o.days}일치만 기록)` : '';
  let t = `<b>${m + 1}월</b> · ${year}년 ${a ? fmt(a.sum) + u + part(a) : '기록 없음'}`;
  t += ` · ${year - 1}년 ${b ? fmt(b.sum) + u + (b.days < dim(year - 1, m + 1) ? ` (${b.days}일치만 기록)` : '') : '기록 없음'}`;
  if(a && b && b.sum !== 0 && a.days >= dim(year, m + 1) && b.days >= dim(year - 1, m + 1)) t += ` · 전년 대비 ${((a.sum / b.sum - 1) * 100).toFixed(1)}%`;
  return t;
}
function render(){
  $('yLbl').textContent = year + '년'; $('lgCur').textContent = year + '년'; $('lgPrv').textContent = (year - 1) + '년';
  const msgs = [];
  if(!configured()) msgs.push('config.js에 Supabase 주소와 키가 없습니다.');
  else if(!loaded) msgs.push('서버에 연결되지 않았습니다.');
  $('msgs').innerHTML = msgs.map(t => `<div class="banner">${t}</div>`).join('');
  $('note').textContent = loaded ? (nRows ? `당직일지 기록: ${firstDate} ~ ${lastDate} (${nRows}일치). 월 사용량 = 그 달 일일 사용량의 합이며, 기록이 없는 날은 0이 아니라 빠진 값입니다. 연한 막대는 그 달 기록이 일부 빠진 경우입니다.` : '당직일지 기록이 아직 없습니다.') : '';
  $('yPrev').disabled = false; $('yNext').disabled = year >= new Date().getFullYear();
  $('cards').innerHTML = ITEMS.map(it => {
    const per = agg[it.k] || {}, sum = y => Object.keys(per).filter(k => k.startsWith(y + '-')).reduce((t, k) => t + per[k].sum, 0), has = y => Object.keys(per).some(k => k.startsWith(y + '-'));
    return `<section class="card" data-k="${it.k}"><h2>${it.label}<small>${it.unit}</small></h2>
      <div class="sum">${year}년 기록분 합계 ${has(year) ? fmt(sum(year)) : '–'}${has(year - 1) ? ` · ${year - 1}년 ${fmt(sum(year - 1))}` : ''}</div>
      ${chartSVG(it)}<div class="det" id="det-${it.k}">${detail(it)}</div></section>`;
  }).join('');
}
$('cards').addEventListener('click', e => {
  const h = e.target.closest('.hit'); if(!h) return; const it = ITEMS.find(x => x.k === h.dataset.k), m = +h.dataset.m;
  sel[it.k] = sel[it.k] === m ? null : m;
  const card = h.closest('.card'); card.querySelector('svg').outerHTML = chartSVG(it); card.querySelector('.det').innerHTML = detail(it);
});
$('yPrev').addEventListener('click', () => { year--; sel = {}; render(); });
$('yNext').addEventListener('click', () => { if(year < new Date().getFullYear()){ year++; sel = {}; render(); } });

/* ---------- 불러오기 ---------- */
function showGate(msg){ $('gate').hidden = false; $('gateMsg').textContent = msg || ''; setTimeout(() => $('gateInput').focus(), 50); }
async function load(){
  if(!configured()){ setSync('off', '설정 필요'); render(); return; }
  try{
    const ok = await sb('rpc/team_check', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    if(ok === false){ showGate(teamCode() ? '팀 코드가 맞지 않습니다.' : ''); setSync('off', '팀 코드 필요'); return; }
    $('gate').hidden = true;
    const rows = [];
    for(let off = 0; ; off += 1000){
      const page = await sb('logs?select=date,m:data->meters&order=date.asc&limit=1000&offset=' + off);
      rows.push(...page); if(page.length < 1000) break;
    }
    const b = await sb('config?select=data&key=eq.base');
    base = (b && b[0] && b[0].data) || {};
    logs = rows; loaded = true; compute();
    setSync('on', '연결됨 ' + new Date().toTimeString().slice(0, 5));
  }catch(e){
    setSync('off', loaded ? '연결 끊김(마지막 상태)' : '연결 안 됨');
    if(e.status === 401 || e.status === 403) showGate('팀 코드가 맞지 않습니다.');
  }
  render();
}
$('gateForm').addEventListener('submit', e => {
  e.preventDefault(); const v = $('gateInput').value.trim();
  if(!/^[\x21-\x7e]{4,64}$/.test(v)){ $('gateMsg').textContent = '영문·숫자·기호 4자 이상으로 입력하세요.'; return; }
  store.set('dutylog.team', v); $('gateMsg').textContent = '확인 중…'; load();
});
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && configured() && teamCode()) load(); });
render(); load();
})();
</script>
